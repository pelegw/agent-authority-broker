# New Relic, US region (NEW_RELIC_REGION=US, the default). The same file as
# region-EU.yaml except for base_uri (a test keeps them so).
#
# Fluent Bit's New Relic output is named nrlogs. The license key comes from
# the environment, where compose puts it for this container only; it is in
# no file. Retries never stop: while New Relic is down, records wait in
# memory up to pipeline.yaml's mem_buf_limit.
includes:
  - pipeline.yaml

pipeline:
  outputs:
    - name: nrlogs
      match: "aab.*"
      base_uri: https://log-api.newrelic.com/log/v1
      license_key: ${NEW_RELIC_LICENSE_KEY}
      compress: gzip
      retry_limit: no_limits
