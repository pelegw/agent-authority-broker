[project]
name = "aab-plugin-runtime"
version = "0.3.0"
description = "Hosts Agent Authority Broker plugin adapters behind the internal plugin API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "cryptography>=42",      # Fernet secret store
    "pyyaml>=6,<7",          # manifests shipped as YAML
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aab_plugin_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
