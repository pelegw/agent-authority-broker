[project]
name = "aab-plugin-google"
version = "0.2.0"
description = "Google plugin service (Gmail, Calendar, Drive) for the Agent Authority Broker (plugin-google container)"
requires-python = ">=3.12"
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
# aab-plugin-runtime is the repo's own package at ../../plugin-runtime; it is
# not on PyPI. Install both in one command so pip resolves it from the path:
#   pip install -e plugin-runtime -e "plugins/google[dev]"   (repo root)
# The Dockerfile does the same with the `runtime` build context.
dependencies = [
    "aab-plugin-runtime>=0.2.0",
    "httpx>=0.27,<1",          # Google OAuth + REST APIs
    "pyyaml>=6,<7",            # the manifests ship as YAML
    "uvicorn>=0.30,<1",        # serves the plugin API in the container
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aab_plugin_google"]      # includes manifests/*.yaml (package data)

[tool.pytest.ini_options]
testpaths = ["tests"]
