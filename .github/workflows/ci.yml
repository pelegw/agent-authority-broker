name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install broker (editable, with dev extras)
        run: pip install -e "broker[dev]"
      # Includes tests/test_init_secrets.py, so the secrets script (and its
      # POSIX 0600 check, skipped on Windows) runs here too.
      - name: pytest
        working-directory: broker
        run: python -m pytest
      # The plugin runtime (hosts plugin adapters in their own containers)
      # is its own package with its own tests.
      - name: plugin runtime tests
        run: |
          pip install -e "plugin-runtime[dev]"
          cd plugin-runtime && python -m pytest

  plugin-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # hashFiles is not available in a job-level `if` (nothing is checked out
      # yet), so each step carries the guard: until plugin-runtime/ exists the
      # job runs and passes as a no-op.
      - name: Install plugin-runtime (editable, with dev extras)
        if: hashFiles('plugin-runtime/pyproject.toml') != ''
        run: pip install -e "plugin-runtime[dev]"
      - name: pytest
        if: hashFiles('plugin-runtime/pyproject.toml') != ''
        run: pytest plugin-runtime

  # The opt-in plugin installer (installer/): descriptor validation, the
  # overlay renderer (golden file), the .env helper, scripts/compose-files.sh,
  # and the HTTP service with a fake command runner and local bare git
  # repositories. No Docker needed.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install installer (editable, with dev extras)
        run: pip install -e "installer[dev]"
      - name: pytest
        working-directory: installer
        run: python -m pytest

  # The base image every external plugin builds FROM (plugins/base;
  # release.yml publishes it as ghcr.io/pelegw/aab-plugin-base on a v* tag).
  # Built here on every push without pushing, so a broken base Dockerfile
  # fails CI before a release depends on it, and the contract plugins rely on
  # (docs/plugin-packaging.md) is checked inside the image.
  plugin-base-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build plugins/base (no push)
        run: docker build --build-context runtime=plugin-runtime -t aab-plugin-base:ci plugins/base
      - name: The image keeps the contract plugins build on
        run: |
          docker run --rm aab-plugin-base:ci sh -c '
            test "$(id -u):$(id -g)" = "10001:10001" &&
            test "$(stat -c %u:%a /secrets)" = "10001:700" &&
            test "$PLUGIN_SECRETS_DIR" = /secrets &&
            python -c "import aab_plugin_runtime, uvicorn"'

  # The WhatsApp plugin service (plugins/whatsapp): its own package and tests.
  # The broker job above also runs broker/tests/targets, which serves this
  # plugin through the runtime end to end (imported from source there).
  plugin-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # aab-plugin-runtime is the repo's own package (not on PyPI): installing
      # both in one command lets pip resolve the dependency from the path.
      - name: Install plugin-runtime + plugin-whatsapp (editable, with dev extras)
        run: pip install -e plugin-runtime -e "plugins/whatsapp[dev]"
      - name: pytest
        working-directory: plugins/whatsapp
        run: python -m pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validate every compose shape against a throwaway .env from the real
      # secrets script, so a missing variable or bad key fails here: base,
      # base+public, base+installer (INSTALLER_ENABLED=true), and the full set
      # scripts/compose-files.sh prints with an installer-rendered plugin
      # overlay (the golden file) in plugins.d, then the same set with the
      # New Relic overlay (NEWRELIC_ENABLED=true): it must refuse to start
      # without a license key, and validate with a fake one.
      - name: docker compose config (base, public, installer, rendered plugin, New Relic)
        run: |
          python3 scripts/init_secrets.py --out .env
          sed -i 's/^SITE_DOMAIN=$/SITE_DOMAIN=aab.example.com/' .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.public.yml config -q
          sed -i 's/^INSTALLER_ENABLED=false$/INSTALLER_ENABLED=true/' .env
          docker compose -f docker-compose.yml -f docker-compose.installer.yml config -q
          mkdir -p plugins.d/finance/src
          cp installer/tests/golden/finance.compose.yml plugins.d/finance/compose.yml
          python3 scripts/init_secrets.py --out .env --rotate PLUGIN_TOKEN_FINANCE
          python3 scripts/init_secrets.py --out .env --rotate PLUGIN_SECRETS_KEY_FINANCE
          sh scripts/compose-files.sh
          docker compose $(sh scripts/compose-files.sh) config -q
          cp installer/tests/golden/finance.newrelic.yml plugins.d/finance/newrelic.yml
          sed -i 's/^NEWRELIC_ENABLED=false$/NEWRELIC_ENABLED=true/' .env
          sh scripts/compose-files.sh
          # (`! cmd` would not fail a `bash -e` step; this does.)
          if docker compose $(sh scripts/compose-files.sh) config -q; then
            echo "the New Relic overlay must refuse to start without NEW_RELIC_LICENSE_KEY"
            exit 1
          fi
          sed -i 's/^NEW_RELIC_LICENSE_KEY=$/NEW_RELIC_LICENSE_KEY=ci-fake-license-key/' .env
          docker compose $(sh scripts/compose-files.sh) config -q
          rm -rf .env plugins.d

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: sidecars/whatsapp/go.sum
      - name: go build + test
        working-directory: sidecars/whatsapp
        run: |
          go build ./...
          go test ./...

  # integrations/ is generated from the vendored manifests (never the DB) and
  # never hand-edited: re-render it and fail if the commit does not match.
  skill-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install broker (provides the aab CLI)
        run: pip install -e "broker[dev]"
      - name: Re-render the skill doc
        run: >-
          aab skill build --all-plugins --base-url "{{BASE_URL}}"
          --out integrations/claude-skill/agent-authority-broker/SKILL.md
      # diff catches edits; status also catches a generated file never committed.
      - name: Fail on drift
        run: |
          git diff --exit-code integrations/
          test -z "$(git status --porcelain integrations/)"

  # The Google plugin service (plugins/google: gmail, gcal, gdrive over one
  # google_oauth connection): its own package and tests against the fake
  # Google. The broker job above also runs broker/tests/targets/test_google.py,
  # which serves this plugin through the runtime end to end.
  plugin-google:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # aab-plugin-runtime is the repo's own package (not on PyPI): installing
      # both in one command lets pip resolve the dependency from the path.
      - name: Install plugin-runtime + plugin-google (editable, with dev extras)
        run: pip install -e plugin-runtime -e "plugins/google[dev]"
      - name: pytest
        working-directory: plugins/google
        run: python -m pytest

  # The GitHub plugin service (plugins/github): its own package and tests,
  # against a scripted GitHub (tests/fakes.py). The broker job above also
  # runs broker/tests/targets/test_github.py, which serves this plugin
  # through the runtime end to end (imported from source there) and fails
  # if the vendored manifest drifts from the plugin's.
  plugin-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # aab-plugin-runtime is the repo's own package (not on PyPI): installing
      # both in one command lets pip resolve the dependency from the path.
      - name: Install plugin-runtime + plugin-github (editable, with dev extras)
        run: pip install -e plugin-runtime -e "plugins/github[dev]"
      - name: pytest
        working-directory: plugins/github
        run: python -m pytest
