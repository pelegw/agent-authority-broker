name: aab

# Local run: python scripts/init_secrets.py && docker compose up -d --build
# The broker then listens on 127.0.0.1:${BROKER_PORT:-8080} only.
# Public run: add docker-compose.public.yml on top (see docs/deployment.md).
#
# Shape (docs/architecture.md section 2): one container per plugin service.
# The broker holds NO target credential; each plugin service holds its own,
# encrypted in its own secret volume under its own PLUGIN_SECRETS_KEY_<SERVICE>.
#
#   edge_net      edge <-> broker            (edge exists only in the public overlay)
#   net_whatsapp  broker <-> plugin-whatsapp  \  one network per plugin service: the
#   net_github    broker <-> plugin-github     > edge can never reach a plugin, and no
#   net_google    broker <-> plugin-google    /  plugin can reach another plugin
#   wa_internal   plugin-whatsapp <-> whatsapp-sidecar (the broker can't reach the sidecar)
#
# Env split: there is deliberately no env_file. .env holds every value, but
# each service below receives only the variables it names, so no container
# ever sees another container's token or key.
#
# .env holds only what cannot live in the database (docs/configuration.md):
# generated bootstrap secrets and fail-closed exposure settings. Third-party
# credentials (Telegram bot token, GitHub App, Google OAuth client) are entered
# in the console: plugin credentials are relayed once to the plugin's
# /configure, the Telegram token is encrypted under BROKER_SECRETS_KEY.

# Every service logs to stdout; Docker keeps it in json-file logs, rotated so
# they cannot fill the disk: at most 5 files of 10 MB per container
# (docs/logging.md, including shipping to a collector with another driver).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # The only thing agents ever talk to: REST + MCP, owner console, grants,
  # decision record, Telegram cards. Reaches each plugin service over that
  # service's own network with a per-service X-Plugin-Token; holds no target
  # credential itself. The only container on every plugin network.
  broker:
    build:
      context: ./broker
      # VERSION lives at the repo root (single source); the Dockerfile copies
      # it from this named context.
      additional_contexts:
        repo: .
    restart: unless-stopped
    logging: *logging
    # No depends_on on the plugins: a plugin that is down shows as unhealthy
    # in the console; it does not keep the broker from starting.
    networks: [edge_net, net_whatsapp, net_github, net_google]
    ports:
      - "127.0.0.1:${BROKER_PORT:-8080}:8080"   # loopback only; the public overlay removes it
    volumes:
      - broker_data:/gwdata   # broker-owned DB (principals, keys, grants, decisions)
    environment:
      BROKER_DB: /gwdata/broker.db
      TZ: ${TZ:-UTC}
      SETUP_TOKEN: ${SETUP_TOKEN:?run 'python scripts/init_secrets.py' to create .env}
      BROKER_SECRETS_KEY: ${BROKER_SECRETS_KEY:?run 'python scripts/init_secrets.py' to create .env}
      DECISION_SIGNING_KEY: ${DECISION_SIGNING_KEY:?run 'python scripts/init_secrets.py' to create .env}
      # The base file is local-only, so origin lockdown stays OFF here even
      # though .env carries a generated ORIGIN_SECRET (otherwise every local
      # request would 403 and boot would demand Cloudflare Access).
      # docker-compose.public.yml turns it on.
      ORIGIN_SECRET: ""
      CF_ACCESS_ENABLED: ${CF_ACCESS_ENABLED:-false}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_ALLOWED_EMAILS: ${CF_ACCESS_ALLOWED_EMAILS:-}
      ALLOW_INSECURE_ADMIN: ${ALLOW_INSECURE_ADMIN:-false}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
      # Where each plugin service answers (on its own network) and the token the
      # broker presents to it. Keyed by service, not plugin id: plugin-google
      # hosts gmail, gcal and gdrive behind one URL and one token.
      PLUGIN_URL_WHATSAPP: http://plugin-whatsapp:8090
      PLUGIN_URL_GITHUB: http://plugin-github:8090
      PLUGIN_URL_GOOGLE: http://plugin-google:8090
      PLUGIN_TOKEN_WHATSAPP: ${PLUGIN_TOKEN_WHATSAPP:?run 'python scripts/init_secrets.py' to create .env}
      PLUGIN_TOKEN_GITHUB: ${PLUGIN_TOKEN_GITHUB:?run 'python scripts/init_secrets.py' to create .env}
      PLUGIN_TOKEN_GOOGLE: ${PLUGIN_TOKEN_GOOGLE:?run 'python scripts/init_secrets.py' to create .env}
      # Process-level logging (docs/logging.md): INFO or DEBUG/WARNING/ERROR, and
      # text or json (one JSON object per line). Read once at start.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}

  # WhatsApp plugin service: the plugin runtime hosting the whatsapp adapter.
  # Reads the archive (messages.db) read-only and drives the sidecar over
  # wa_internal. The only container besides the sidecar holding SIDECAR_TOKEN.
  plugin-whatsapp:
    build:
      context: ./plugins/whatsapp
      additional_contexts:
        runtime: ./plugin-runtime   # the aab-plugin-runtime package
    restart: unless-stopped
    logging: *logging
    depends_on: [whatsapp-sidecar]
    networks: [net_whatsapp, wa_internal]   # the broker, and its sidecar; no other plugin
    volumes:
      # The sidecar-owned archive (messages.db only), read-only here. The
      # WhatsApp session is in wa_session, which this container never mounts.
      # SQLite reads the WAL archive through the sidecar's -shm file. A clean
      # sidecar stop removes -wal/-shm, so archive reads answer 503 until it is
      # back; after a crash they return the last committed rows. Never stale
      # or partial data (docs/plugins/whatsapp.md, "Read-only WAL archive").
      - wa_data:/data:ro
      - whatsapp_secrets:/secrets   # this plugin's own encrypted secret store
    # Inside the container the names are generic (aab_plugin_runtime.from_env
    # reads PLUGIN_TOKEN / PLUGIN_SECRETS_KEY / PLUGIN_SECRETS_DIR); the values
    # are this service's own .env entries, so no other service's token or key
    # can reach it. SIDECAR_URL / SIDECAR_TOKEN / MESSAGES_DB are deployment
    # values, deliberately not console config (the manifest declares none).
    environment:
      PLUGIN_TOKEN: ${PLUGIN_TOKEN_WHATSAPP:?run 'python scripts/init_secrets.py' to create .env}
      PLUGIN_SECRETS_KEY: ${PLUGIN_SECRETS_KEY_WHATSAPP:?run 'python scripts/init_secrets.py' to create .env}
      PLUGIN_SECRETS_DIR: /secrets
      SIDECAR_URL: http://whatsapp-sidecar:8081
      SIDECAR_TOKEN: ${SIDECAR_TOKEN:?run 'python scripts/init_secrets.py' to create .env}
      MESSAGES_DB: /data/messages.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}

  # Speaks the WhatsApp multi-device protocol (whatsmeow). Holds the session,
  # the one container that can read it. Deliberately "dumb": no policy, no
  # agent-facing API. Only plugin-whatsapp can reach it (wa_internal); never
  # published to the host.
  whatsapp-sidecar:
    build: ./sidecars/whatsapp
    restart: unless-stopped
    logging: *logging
    networks: [wa_internal]
    volumes:
      - wa_data:/data           # read-write: messages.db, the archive plugin-whatsapp reads
      - wa_session:/session     # read-write, this container only: session.db (plaintext, whatsmeow's store)
    environment:
      SIDECAR_TOKEN: ${SIDECAR_TOKEN:?run 'python scripts/init_secrets.py' to create .env}
      # Where session.db lives: the wa_session mount above (the image sets the
      # same default; set here so the session can never land in /data).
      SESSION_DIR: /session
      # Shown in WhatsApp > Linked devices. Takes effect on the next (re-)link.
      DEVICE_NAME: ${DEVICE_NAME:-AAB}
      # Its own lines follow LOG_LEVEL too (WARNING and up drop the per-request
      # line); it has no JSON format.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}

  # GitHub plugin service: holds the GitHub App private key and installation,
  # mints installation tokens narrowed to the repos/permissions of each call.
  # The App id, slug, key and the PAT fallback are console config (relayed
  # once to /configure, encrypted in github_secrets), not env.
  plugin-github:
    build:
      context: ./plugins/github
      additional_contexts:
        runtime: ./plugin-runtime   # the aab-plugin-runtime package
    restart: unless-stopped
    logging: *logging
    networks: [net_github]         # the broker only; no other plugin can reach it
    volumes:
      - github_secrets:/secrets     # this plugin's own encrypted secret store
      # Optional file-based alternative to pasting the App private key in the
      # console: put app.pem in GITHUB_APP_KEY_DIR on the host (default
      # ./data/github-app, git-ignored) and set the GitHub plugin's
      # private_key_path to /run/secrets/github/app.pem in the console (the
      # plugin accepts only files inside that directory). Mounted into this
      # container only, read-only. See docs/plugins/github.md.
      - type: bind
        source: ${GITHUB_APP_KEY_DIR:-./data/github-app}
        target: /run/secrets/github
        read_only: true
        bind:
          create_host_path: true
    # Inside the container the names are generic (aab_plugin_runtime.from_env
    # reads PLUGIN_TOKEN / PLUGIN_SECRETS_KEY / PLUGIN_SECRETS_DIR); the values
    # are this service's own .env entries, so no other service's token or key
    # can reach it.
    environment:
      PLUGIN_TOKEN: ${PLUGIN_TOKEN_GITHUB:?run 'python scripts/init_secrets.py' to create .env}
      PLUGIN_SECRETS_KEY: ${PLUGIN_SECRETS_KEY_GITHUB:?run 'python scripts/init_secrets.py' to create .env}
      PLUGIN_SECRETS_DIR: /secrets
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # The App id, slug, key (or key file path) and the PAT fallback arrive
      # via /configure from the console, not env.

  # Google plugin service: one container for gmail, gcal and gdrive, because
  # they share one OAuth credential (the isolation boundary that matters).
  # Holds the client secret and refresh token (encrypted in google_secrets);
  # mints a short-lived access token per scope set, per call.
  plugin-google:
    build:
      context: ./plugins/google
      additional_contexts:
        runtime: ./plugin-runtime   # the aab-plugin-runtime package
    restart: unless-stopped
    logging: *logging
    networks: [net_google]         # the broker only; no other plugin can reach it
    volumes:
      - google_secrets:/secrets     # this plugin's own encrypted secret store
    # Generic names inside the container (aab_plugin_runtime.from_env). No
    # Google values here on purpose: the OAuth client id/secret are console
    # config (relayed once to /configure, stored encrypted in /secrets), and
    # the broker passes the OAuth redirect URI with each /connect/start.
    environment:
      PLUGIN_TOKEN: ${PLUGIN_TOKEN_GOOGLE:?run 'python scripts/init_secrets.py' to create .env}
      PLUGIN_SECRETS_KEY: ${PLUGIN_SECRETS_KEY_GOOGLE:?run 'python scripts/init_secrets.py' to create .env}
      PLUGIN_SECRETS_DIR: /secrets
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}

# None of these is `internal: true`: the broker (Telegram, Cloudflare JWKS),
# the plugins (GitHub, Google) and the sidecar (WhatsApp) all need egress.
# Isolation here is about which containers can reach which, not the internet.
# One network per plugin service, not one shared by all of them: a
# compromised plugin can reach the broker (whose API wants an agent key or
# an owner credential, as from anywhere) and plugin-whatsapp its sidecar,
# but never another plugin's API.
networks:
  edge_net: {}
  net_whatsapp: {}
  net_github: {}
  net_google: {}
  wa_internal: {}

# Named volumes (not bind mounts): SQLite WAL locking is unreliable over
# Docker Desktop's NTFS file sharing; named volumes live on ext4 inside WSL2.
# Each secret volume is mounted by exactly one service, and so is wa_session
# (the WhatsApp session, whatsapp-sidecar only).
volumes:
  broker_data: {}
  wa_data: {}
  wa_session: {}
  whatsapp_secrets: {}
  github_secrets: {}
  google_secrets: {}
